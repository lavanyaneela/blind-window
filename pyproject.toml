[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-window"
version = "1.0.0"
description = "Quantifies what production monitoring cannot know yet: the regression still invisible today given the label delay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lavanya Neela" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "duckdb>=0.10",
]

[project.optional-dependencies]
registry = ["mlflow>=2.14"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "matplotlib>=3.8",
    "mlflow>=2.14",
]

[project.scripts]
blind-window = "blind_window.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/blind_window"]
