<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="420" fill="#fafafa"/>
  <text x="430" y="28" text-anchor="middle" font-size="16" fill="#222">blind-window: two event logs in, one honest verdict out</text>

  <!-- simulator -->
  <rect x="30" y="60" width="180" height="92" rx="8" fill="#e8f0fe" stroke="#4472c4"/>
  <text x="120" y="84" text-anchor="middle" font-size="13" fill="#1a3c6e">stream simulator</text>
  <text x="120" y="104" text-anchor="middle" font-size="11" fill="#333">seeded; input shift and</text>
  <text x="120" y="120" text-anchor="middle" font-size="11" fill="#333">concept shift injected</text>
  <text x="120" y="136" text-anchor="middle" font-size="11" fill="#333">independently</text>

  <!-- store -->
  <rect x="270" y="60" width="200" height="92" rx="8" fill="#fef7e0" stroke="#b8860b"/>
  <text x="370" y="84" text-anchor="middle" font-size="13" fill="#6b4e00">append-only SQL log</text>
  <text x="370" y="104" text-anchor="middle" font-size="11" fill="#333">predictions + labels</text>
  <text x="370" y="120" text-anchor="middle" font-size="11" fill="#333">DuckDB default, Postgres</text>
  <text x="370" y="136" text-anchor="middle" font-size="11" fill="#333">dialect in parity (CI)</text>

  <!-- detectors -->
  <rect x="530" y="40" width="150" height="64" rx="8" fill="#eee" stroke="#888"/>
  <text x="605" y="64" text-anchor="middle" font-size="12" fill="#333">input detectors</text>
  <text x="605" y="82" text-anchor="middle" font-size="11" fill="#555">PSI / KS / MMD</text>

  <!-- label side -->
  <rect x="530" y="118" width="150" height="64" rx="8" fill="#eee" stroke="#888"/>
  <text x="605" y="142" text-anchor="middle" font-size="12" fill="#333">as-of label metrics</text>
  <text x="605" y="160" text-anchor="middle" font-size="11" fill="#555">windowed accuracy</text>

  <!-- power core -->
  <rect x="270" y="210" width="260" height="92" rx="8" fill="#e6f4ea" stroke="#2e7d32"/>
  <text x="400" y="236" text-anchor="middle" font-size="13" fill="#1b5e20">power core</text>
  <text x="400" y="256" text-anchor="middle" font-size="11" fill="#333">minimum detectable drop(t)</text>
  <text x="400" y="272" text-anchor="middle" font-size="11" fill="#333">blind window walk</text>
  <text x="400" y="288" text-anchor="middle" font-size="11" fill="#333">two-sample verdict</text>

  <!-- registry -->
  <rect x="30" y="210" width="180" height="72" rx="8" fill="#f3e8fd" stroke="#7b1fa2"/>
  <text x="120" y="236" text-anchor="middle" font-size="12" fill="#4a148c">MLflow registry</text>
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#333">version served per</text>
  <text x="120" y="270" text-anchor="middle" font-size="11" fill="#333">window (SQLite)</text>

  <!-- policies -->
  <rect x="590" y="210" width="230" height="92" rx="8" fill="#fde8e8" stroke="#c62828"/>
  <text x="705" y="234" text-anchor="middle" font-size="12" fill="#8e0000">retraining triggers (E5)</text>
  <text x="705" y="254" text-anchor="middle" font-size="11" fill="#333">drift-alarm / scheduled /</text>
  <text x="705" y="270" text-anchor="middle" font-size="11" fill="#333">label-confirmed, priced in</text>
  <text x="705" y="286" text-anchor="middle" font-size="11" fill="#333">degraded predictions</text>

  <!-- cli -->
  <rect x="270" y="336" width="260" height="60" rx="8" fill="#dde9f7" stroke="#30507a"/>
  <text x="400" y="360" text-anchor="middle" font-size="13" fill="#15314f">CLI: check / report</text>
  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#333">exit 0 confirmed, 1 no, 2 refused, 3 error</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="210" y1="106" x2="268" y2="106" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="84" x2="528" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="128" x2="528" y2="146" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="370" y1="152" x2="395" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="605" y1="184" x2="605" y2="214" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="210" y1="246" x2="268" y2="252" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="532" y1="268" x2="588" y2="262" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="400" y1="302" x2="400" y2="334" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
