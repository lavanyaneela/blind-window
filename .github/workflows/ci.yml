name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: tests with a 95 percent coverage floor
        run: |
          python -m pytest --junitxml=.pytest-junit.xml \
            --cov=blind_window --cov-report=json --cov-fail-under=95
      - name: the published test count equals what this runner collects
        run: |
          collected=$(python -m pytest --collect-only -q | grep -c '::')
          published=$(python -c "import json; print(json.load(open('docs/metrics.json'))['metrics']['tests_total'])")
          echo "collected=$collected published=$published"
          test "$collected" = "$published"

  postgres-parity:
    # Required, not advisory: the SQL skill is executed here, not asserted.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: parity
          POSTGRES_DB: parity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: python -m pytest tests_postgres -q
        env:
          POSTGRES_DSN: host=localhost port=5432 dbname=parity user=postgres password=parity

  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: re-measure every experiment
        run: make experiments
      - name: collect metrics and check every document
        run: |
          python tools/collect_metrics.py
          python tools/check_numbers.py
          python tools/check_durations.py
      - name: prove the checker by breaking a figure
        run: python tools/prove_checker.py
      - name: evidence is byte-stable
        run: |
          python tools/render_evidence.py
          git diff --exit-code docs/evidence
      - name: the committed measurements match a fresh run
        run: git diff --exit-code docs/experiments docs/metrics.json
      - name: job summary
        if: always()
        run: |
          {
            echo "## blind-window receipts"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            python - <<'PY'
          import json
          r = json.load(open("docs/metrics.json"))["rendered"]
          for k in ("blind_window_days", "blind_window_predictions", "answerable_day",
                    "mdd_day7_pts", "drift_perf_correlation", "alarm_precision_pct",
                    "tests_total", "coverage_line_pct"):
              print(f"| {k} | {r[k]} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
